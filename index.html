<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EEF0F2">
<title>Shaxmat 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js?57"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>

<div id="loading">
  <div class="load-mark" data-logo="96"></div>
  <p data-t>Doska tayyorlanmoqda…</p>
</div>

<!-- Bosh menyu -->
<section id="home" class="screen hidden">
  <header class="brand">
    <div class="brand-logo" data-logo="68"></div>
    <div class="brand-text">
      <h1 class="wordmark">Shaxmat</h1>
      <p class="tagline" data-t>Uch oʻlchamli doska, jonli donalar</p>
    </div>
  </header>
  <nav class="menu">
    <button id="btnContinue" class="row-btn resume hidden"><span class="row-ic" data-ic="play"></span><span class="row-t" data-t>Oʻyinni davom ettirish<small data-t>Toʻxtagan joyingizdan</small></span></button>
    <button id="btnAI" class="row-btn lead"><span class="row-ic" data-ic="chip"></span><span class="row-t" data-t>Kompyuterga qarshi<small data-t>Toʻrt daraja: boshlovchidan ustagacha</small></span></button>
    <button id="btnOnline" class="row-btn"><span class="row-ic" data-ic="globe"></span><span class="row-t" data-t>Onlayn oʻyin<small data-t>Reyting yoki doʻst bilan</small></span></button>
    <button id="btnFriend" class="row-btn"><span class="row-ic" data-ic="pair"></span><span class="row-t" data-t>Bir telefonda ikki kishi<small data-t>Navbatma-navbat oʻynash</small></span></button>
    <div class="mini-row">
      <button id="btnPuzzle" class="mini-btn"><span class="mini-ic" data-ic="hint"></span><span class="mini-t" data-t>Masala<small id="pzSub" data-t>2 yurishda mot</small></span></button>
      <button id="btnLessons" class="mini-btn"><span class="mini-ic" data-ic="view"></span><span class="mini-t" data-t>Darslar<small id="lsSub" data-t>Noldan oʻrganing</small></span></button>
      <button id="btnRef" class="mini-btn"><span class="mini-ic" data-ic="send"></span><span class="mini-t" data-t>Taklif<small data-t>Sovgʻa oling</small></span></button>
    </div>
    <div class="foot">
      <button id="btnShop" class="foot-btn" data-t><span data-ic="bag"></span>Doʻkon</button>
      <button id="btnStats" class="foot-btn" data-t><span data-ic="chart"></span>Natijalar</button>
      <button id="btnSettings" class="foot-btn" data-t><span data-ic="gear"></span>Sozlamalar</button>
    </div>
  </nav>
</section>

<!-- Daraja tanlash -->
<section id="levelSheet" class="sheet hidden">
  <div class="card">
    <h2 data-t>Kompyuterga qarshi</h2>
    <p class="muted" data-t>Raqib kuchi</p>
    <div id="levels" class="chips"></div>
    <p class="muted" data-t>Siz qaysi rangda oʻynaysiz</p>
    <div id="colors" class="chips three">
      <button data-c="w" class="chip" data-t><i class="stone w"></i>Oq</button>
      <button data-c="r" class="chip active" data-t><i class="stone r"></i>Tasodifiy</button>
      <button data-c="b" class="chip" data-t><i class="stone b"></i>Qora</button>
    </div>
    <button id="btnStartAI" class="btn primary" data-t>Oʻyinni boshlash</button>
    <button class="btn ghost" data-close data-t>Bekor qilish</button>
  </div>
</section>

<!-- Oʻyin HUD -->
<section id="hud" class="hidden">
  <div id="barTop" class="pbar top"><i class="ava"></i><div class="pinfo"><div class="pname"></div><div class="caps"></div></div><div class="think hidden" data-t>oʻylayapti</div><div class="adv"></div></div>
  <div id="barBottom" class="pbar bottom"><i class="ava"></i><div class="pinfo"><div class="pname"></div><div class="caps"></div></div><div class="think hidden" data-t>oʻylayapti</div><div class="adv"></div></div>
  <div id="moves" class="moves"></div>
  <div class="tools">
    <button id="tUndo" class="tool"><i data-ic="undo"></i><span data-t>Orqaga</span><em></em></button>
    <button id="tHint" class="tool"><i data-ic="hint"></i><span data-t>Maslahat</span><em></em></button>
    <button id="tView" class="tool"><i data-ic="view"></i><span data-t>Koʻrinish</span></button>
    <button id="tResign" class="tool"><i data-ic="flag"></i><span data-t>Taslim</span></button>
    <button id="tMenu" class="tool"><i data-ic="menu"></i><span data-t>Menyu</span></button>
  </div>
  <div id="status" class="status hidden"></div>
</section>

<!-- Modallar -->
<section id="modal" class="sheet hidden"><div class="card" id="modalCard"></div></section>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
